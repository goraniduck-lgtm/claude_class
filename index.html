<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 수업 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;font-family:'Gowun Dodum',sans-serif;color:#2B2D42;background:#FFF4DF;
  background-image:radial-gradient(#F1D9AE 1.6px,transparent 1.6px);background-size:22px 22px;word-break:keep-all}
main{max-width:860px;margin:0 auto;padding:32px 16px}
h1{font-family:'Jua',sans-serif;font-size:clamp(32px,6vw,48px);text-align:center;margin:0 0 6px}
p.sub{text-align:center;color:#6B6F85;margin:0 0 24px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
a.app{display:block;text-decoration:none;color:inherit;background:#fff;border:3px solid #2B2D42;border-radius:22px;padding:16px;box-shadow:0 6px 0 #2B2D42}
a.app:active{transform:translateY(5px);box-shadow:0 1px 0 #2B2D42}
.ic{font-size:40px}.t{font-family:'Jua',sans-serif;font-size:22px;margin:6px 0 4px}.d{font-size:15px;color:#6B6F85}
.tag{display:inline-block;font-family:'Jua',sans-serif;font-size:14px;background:#FF7A45;color:#fff;border:2px solid #2B2D42;border-radius:999px;padding:1px 10px}
</style>
</head>
<body>
<main>
  <h1>🏫 우리 반 수업 놀이터</h1>
  <p class="sub">수업 시간에 쓰는 게임과 활동 모음</p>
  <div class="apps">
    <a class="app" href="word-hunt/">
      <span class="tag">국어 4-2 · 4단원</span>
      <div class="ic">⚡</div>
      <div class="t">번개 낱말 사냥</div>
      <div class="d">「책 속의 길을 따라」 어려운 낱말을 빠르게 찾는 낱말 찾기 게임</div>
    </a>
  </div>
</main>
</body>
</html>
