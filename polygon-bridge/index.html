function physicsStep(dt){if(phase!=='running'||dt<=0)return;if(workshop()){stepWorkshop(dt);return}if(motionRoute()){stepMotion(dt);return}const pieces=Math.ceil(dt/.007),h=dt/pieces,active=completeModule(),course=terrain();
  for(let k=0;k<pieces;k++){
    ball.vy+=grav*h;ball.x+=ball.vx*h;ball.y+=ball.vy*h;ball.rotation+=ball.vx*h/R;
    const track=legacyTrack(course,ball.x,active);
    const floor=track?.y??null,slope=track?.slope??0;
    if(floor!==null&&ball.y+R>=floor-9&&ball.y+R<=floor+24&&ball.vy>-140){ball.y=floor-R;ball.vy=ball.vx*slope;ball.vx*=.99997}
    if(ball.x>=956 && ball.y<course.points.at(-1).y){win();break}
    if(ball.y>H-16||ball.x>W+20){fail(active?'구슬이 경로를 벗어났습니다.':'수학 조건이 충족되지 않아 다리가 고정되지 않았습니다.');break}
  }
  elapsed+=dt;
  if(!active)bridgeFall=Math.max(0,Math.pow(Math.max(0,elapsed-.1),1.8)*150);
  if(phase==='running'&&elapsed>7.8)fail('이동 시간이 지났습니다.');
  if(phase==='running'&&(!trail.length||dist(ball,trail[trail.length-1])>11)){trail.push(copy(ball));if(trail.length>85)trail.shift()}
  ui.progress.textContent=clamp(Math.round((ball.x-95)/(956-95)*100),0,100)+'%'
}

const legacyCourses=legacyBanks.map(bank=>bank&&({
  points:bank.map(([x,y])=>({x,y})),
  launchEdge:bank[0][0],
  exitEdge:bank.at(-1)[0]
}));
function terrain(){return legacyCourses[current]}
function legacyTrack(course,x,powered){
  const points=course.points;
  if(x<=course.launchEdge)return {y:points[0].y,slope:0};
  if(x>=course.exitEdge)return {y:points.at(-1).y,slope:0};
  if(!powered)return null;
  const index=points.findIndex(point=>point.x>=x);
  const a=points[index-1],b=points[index];
  const slope=(b.y-a.y)/(b.x-a.x);
  return {y:a.y+(x-a.x)*slope,slope};
}

function buildRoute(){
  const map=routes[motionRoute()==='fork'?pathChoice:motionRoute()];
  let x=map.entry,y=map.startY;
  const sections=map.sections.map(spec=>{
    const d={...spec,x,y,center:(x+spec.end)/2,powered:false,lowering:0};
    if(d.type==='deck'){d.hinge=d.center-d.width/2;d.landing=d.center+d.width/2;}
    x=d.end;
    y+=(d.drop??0)+(d.rise??0);
    return d;
  });
  const devices=sections.filter(section=>section.module!==undefined);
  return {...map,sections,devices,exitY:y,varySpeed:map.speed,lift:devices.find(d=>d.type==='lift'),
    ceiling:map.ceiling?{...map.ceiling,y:y-46}:null};
}

function deckEnd(d){
  const angle=1.12*(1-(d.powered?clamp(elapsed/.45,0,1):0));
  return {x:d.hinge+d.width*Math.cos(angle),y:d.y+d.width*Math.sin(angle)};
}
function gateArm(d){
  const pivot={x:d.center,y:d.y-69};
  const angle=(d.powered?clamp(elapsed/.57,0,1):0)*Math.PI/2;
  return [pivot,{x:pivot.x+69*Math.sin(angle),y:pivot.y+69*Math.cos(angle)}];
}
function routeFloor(x){
  if(x<=route.entry)return route.startY;
  if(x>=route.exit)return route.exitY;
  const d=route.sections.find(section=>x<section.end);
  if(d.type==='gap')return null;
  if(d.type==='ramp')return d.y+d.rise*(x-d.x)/(d.end-d.x);
  if(d.type==='lift')return d.y+d.lowering;
  if(d.type!=='deck'||x<=d.hinge||x>=d.landing)return d.y;
  const tip=deckEnd(d);
  return x<=tip.x?d.y+(tip.y-d.y)*(x-d.hinge)/(tip.x-d.hinge):null;
}
function touchesGate(d){
  const [a,b]=gateArm(d);
  const arm=vec(a,b);
  const t=clamp(dot(vec(a,ball),arm)/dot(arm,arm),0,1);
  return dist(ball,{x:a.x+t*arm.x,y:a.y+t*arm.y})<=R+4;
}
function stepMotion(dt){
  const pieces=Math.ceil(dt/.006),h=dt/pieces;
  const {lift,ceiling}=route;
  for(let i=0;i<pieces&&phase==='running';i++){
    if(lift?.waiting)break;
    elapsed+=h;
    if(lift?.carrying){
      lift.lowering=Math.min(lift.drop,lift.lowering+95*h);
      ball.y=lift.y+lift.lowering-R;
      if(lift.lowering===lift.drop){lift.carrying=false;ball.vx=route.varySpeed?launchSpeed:255;}
      continue;
    }

    const previousX=ball.x,previousBottom=ball.y+R;
    const previousFloor=routeFloor(previousX);
    const supported=previousFloor!==null&&Math.abs(previousBottom-previousFloor)<.1;
    ball.x+=ball.vx*h;
    const ramp=route.sections.find(d=>d.kick&&previousX<d.end&&ball.x>=d.end);
    if(ramp&&supported)ball.vy=-ramp.kick*ball.vx/280;
    ball.vy+=grav*h;
    ball.y+=ball.vy*h;
    ball.rotation+=ball.vx*h/R;
    const floor=routeFloor(ball.x);
    if(floor!==null&&((supported&&Math.abs(floor-previousFloor)<4)||
      (previousBottom<=floor&&ball.y+R>=floor&&ball.vy>=0))){
      ball.y=floor-R;ball.vy=0;
    }

    if(lift&&lift.lowering<lift.drop&&ball.x+R>=lift.center&&ball.x<lift.center&&Math.abs(ball.y+R-lift.y)<1){
      ball.x=lift.center-R;ball.vx=0;
      if(lift.powered){
        lift.waiting=true;liftButton.disabled=false;
        toast('발판에 탔어요. 승강기를 내려 보세요.');
      }else fail('승강기 앞에서 멈췄어요. 발판의 장치 모양을 확인해 보세요.');
    }
    if(route.devices.some(d=>d.type==='gate'&&touchesGate(d))){
      ball.vx=0;
      fail('구슬이 닫힌 회전문에 닿았어요. 문과 같은 모양의 장치를 살펴보세요.');
    }
    if(ceiling&&ball.x+R>=ceiling.x&&ball.x-R<=ceiling.end&&ball.y-R<ceiling.y){
      ball.vx=0;
      fail('구슬이 충분히 내려가기 전에 터널 벽에 닿았어요. 더 천천히 출발해 보세요.');
    }
    if(ball.x>=956&&Math.abs(ball.y+R-route.exitY)<1)win();
    if(ball.y>H-16||ball.x>W+20)fail('구슬이 빈 구간 아래로 떨어졌어요. 다리와 경사로를 떠나는 속도를 살펴보세요.');
  }
  if(phase==='running'&&elapsed>9)fail('이동 시간이 지났습니다.');
  if(!trail.length||dist(ball,trail[trail.length-1])>10)trail.push(copy(ball));
  ui.progress.textContent=clamp(Math.round((ball.x-95)/(956-95)*100),0,100)+'%';
}

function workshopSurface(x,tipY){
  const distance=clamp((x-deckStart.x)/(dock.x-deckStart.x),0,1);
  return deckStart.y+distance*(tipY-deckStart.y);
}

function stepWorkshop(dt){
  const pieces=Math.ceil(dt/.006),h=dt/pieces;
  for(let i=0;i<pieces&&phase==='running';i++){
    const nextX=Math.min(ball.x+ball.vx*h,workshopFinish.upper);
    if(ball.x<dock.x&&nextX>=dock.x){
      const arrivalY=geom.tipY-R;
      if(arrivalY+R>dock.y+dockClearance){
        fail('위쪽 구슬이 출구 턱에 막혔어요. 판 끝을 조금 올려 보세요.');
        break;
      }
      if(arrivalY-R<dock.y-2*R-dockClearance){
        fail('위쪽 구슬이 출구 가로대에 닿았어요. 판 끝을 조금 내려 보세요.');
        break;
      }
    }
    ball.rotation+=(nextX-ball.x)/R;
    ball.x=nextX;
    ball.y=(ball.x>=dock.x?dock.y:workshopSurface(ball.x,geom.tipY))-R;
    const nextLowerX=Math.min(lowerBall.x+ball.vx*h,workshopFinish.lower);
    lowerBall.rotation+=(nextLowerX-lowerBall.x)/R;
    lowerBall.x=nextLowerX;
    lowerBall.y=workshopSurface(lowerBall.x,dock.y)+beamOffset-R;
    if(dist(ball,lowerBall)<=2*R){
      fail('두 길이 가까워져 구슬끼리 부딪혔어요. 두 길이 나란히 내려가도록 위쪽 판을 움직여 보세요.');
      break;
    }
    if(ball.x===workshopFinish.upper&&lowerBall.x===workshopFinish.lower)win();
  }
  if(!trail.length||dist(ball,trail.at(-1))>11)trail.push(copy(ball));
  ui.progress.textContent=phase==='won'?'100%':Math.min(99,Math.floor((lowerBall.x-95)/(workshopFinish.lower-95)*100))+'%';
}

  if(mode()===4){
   if(drag==='D'){val.x=clamp(val.x,250,470);val.y=clamp(val.y,350,450);let sx=A.x-(B.y-A.y)/(B.x-A.x)*(val.y-A.y);if(Math.abs(val.x-sx)<14)val.x=sx;geom.D=val}
   else if(drag==='C'){val.x=clamp(val.x,615,850);val.y=clamp(val.y,421,520);let sy=geom.D.y+(B.y-A.y)/(B.x-A.x)*(val.x-geom.D.x);if(Math.abs(val.y-sy)<13)val.y=sy;geom.C=val}

function selectVertex(id){if(id===null){toast('오각형의 노란 꼭짓점 하나를 먼저 선택하세요.');return}const n=Number(id);if(selected===null){selected=n;toast(`${n+1}번 선택! 다른 꼭짓점을 눌러 두 점을 연결해 보세요.`);return}

  if(b-a===1||b-a===4){feedback('이것은 대각선이 아니라 변이에요.','이웃한 꼭짓점을 연결하면 오각형의 변이 됩니다. 대각선은 이웃하지 않는 두 꼭짓점을 연결해요.');toast(`${a+1}번과 ${b+1}번은 이웃한 꼭짓점이에요. 다른 점을 고르세요.`);selected=null;return}
  if(geom.edges.has(key)){feedback('이미 연결한 대각선이에요.','같은 선분을 두 번 세지 않아요. 아직 그리지 않은 대각선을 찾아보세요.');toast('이미 연결했습니다 · 중복은 세지 않아요.');selected=null;return}
  geom.edges.add(key);selected=null;if(phase==='won'||phase==='failed'){phase='edit';initBall();clearQuiz()}refresh();if(geom.edges.size<5){feedback('대각선 연결 성공!',`${a+1}번과 ${b+1}번 꼭짓점을 이어서 대각선 ${geom.edges.size}개를 완성했어요.`);toast(`대각선 연결! ${geom.edges.size} / 5개`)}
}
