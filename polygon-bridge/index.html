<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('game'),cx=cv.getContext('2d');
const W=1100,H=560,R=16,grav=1180;

const stages=[
 {name:'평행 잠금장치',short:'평행',icon:'∥',title:'미션 1: 평행 잠금장치를 체결하라!',desc:'아래쪽 노란 꼭짓점 두 개를 움직여 다리의 윗변과 아랫변을 평행하게 만드세요.',subject:'사각형 · 평행',math:'윗변 ∥ 아랫변',tip:'두 변이 같은 방향으로 뻗어야 양쪽 기계팔이 닫혀요.',note:'게임 속 특수 잠금장치는 마주 보는 두 변이 평행할 때만 작동합니다. 실제 모든 다리가 평행한 변을 가져야 안정적인 것은 아닙니다.',question:'이번 다리가 고정된 수학적인 이유는 무엇인가요?',answers:['① 변이 4개라서','② 마주 보는 두 변이 평행해서','③ 다리의 색깔이 초록색이라서'],right:1,explain:'윗변과 아랫변이 나란한 방향이 되어 잠금장치가 작동했어요.'},

function physicsStep(dt){if(phase!=='running')return;const pieces=Math.ceil(dt/.007),h=dt/pieces,active=completeModule();

    let floor=null,slope=0;
    if(ball.x<=LEFT.x)floor=LEFT.y;
    else if(ball.x>=RIGHT.x)floor=RIGHT.y;
    else if(active){const u=(ball.x-LEFT.x)/(RIGHT.x-LEFT.x);floor=LEFT.y+(RIGHT.y-LEFT.y)*u;slope=(RIGHT.y-LEFT.y)/(RIGHT.x-LEFT.x)}
    if(floor!==null&&ball.y+R>=floor-9&&ball.y+R<=floor+24&&ball.vy>-140){ball.y=floor-R;ball.vy=ball.vx*slope;ball.vx*=.99997}
    if(ball.x>=956 && ball.y<RIGHT.y){win();break}
    if(ball.y>H-16||ball.x>W+20){fail(active?'구슬이 경로를 벗어났습니다.':'수학 조건이 충족되지 않아 다리가 고정되지 않았습니다.');break}
  }
  elapsed+=dt;
  if(!active)bridgeFall=Math.max(0,Math.pow(Math.max(0,elapsed-.1),1.8)*150);
  if(phase==='running'&&elapsed>7.8)fail('이동 시간이 지났습니다.');
  if(phase==='running'&&(!trail.length||dist(ball,trail[trail.length-1])>11)){trail.push(copy(ball));if(trail.length>85)trail.shift()}
  ui.progress.textContent=clamp(Math.round((ball.x-95)/(956-95)*100),0,100)+'%'
}

  }
  if(mode()===5){val.x=clamp(val.x,445,602);val.y=clamp(val.y,366,505);const v=vec(Q0,val),d=vlen(v);if(Math.abs(d-130)<11&&d>0){val.x=Q0.x+v.x/d*130;val.y=Q0.y+v.y/d*130}geom.D=val}
  if(mode()===6){val.x=clamp(val.x,445,605);val.y=clamp(val.y,367,503);if(Math.abs(val.x-Q0.x)<14&&Math.abs(val.y-(Q0.y+130))<14){val.x=Q0.x;val.y=Q0.y+130}geom.D=val}
  if(phase==='won'||phase==='failed'){phase='edit';initBall();clearQuiz()}refresh();
}
function selectVertex(id){if(id===null){toast('오각형의 노란 꼭짓점 하나를 먼저 선택하세요.');return}const n=Number(id);if(selected===null){selected=n;toast(`${n+1}번 선택! 다른 꼭짓점을 눌러 두 점을 연결해 보세요.`);return}
  if(selected===n){selected=null;toast('선택을 취소했어요.');return}
  const a=Math.min(selected,n),b=Math.max(selected,n),key=`${a}-${b}`;
  if(b-a===1||b-a===4){feedback('이것은 대각선이 아니라 변이에요.','이웃한 꼭짓점을 연결하면 오각형의 변이 됩니다. 대각선은 이웃하지 않는 두 꼭짓점을 연결해요.');toast(`${a+1}번과 ${b+1}번은 이웃한 꼭짓점이에요. 다른 점을 고르세요.`);selected=null;return}
  if(geom.edges.has(key)){feedback('이미 연결한 대각선이에요.','같은 선분을 두 번 세지 않아요. 아직 그리지 않은 대각선을 찾아보세요.');toast('이미 연결했습니다 · 중복은 세지 않아요.');selected=null;return}
  geom.edges.add(key);selected=null;if(phase==='won'||phase==='failed'){phase='edit';initBall();clearQuiz()}refresh();if(geom.edges.size<5){feedback('대각선 연결 성공!',`${a+1}번과 ${b+1}번 꼭짓점을 이어서 대각선 ${geom.edges.size}개를 완성했어요.`);toast(`대각선 연결! ${geom.edges.size} / 5개`)}
}
cv.addEventListener('pointerdown',e=>{if(phase==='running')return;const p=stagePoint(e),id=closest(p);if(mode()===3){selectVertex(id);e.preventDefault();return}if(id!==null){drag=id;cv.setPointerCapture(e.pointerId);editPoint(p);e.preventDefault()}else toast('노란 꼭짓점을 직접 잡고 움직여 보세요.')});
cv.addEventListener('pointermove',e=>{const p=stagePoint(e);if(drag){editPoint(p);e.preventDefault()}else{hover=closest(p);cv.style.cursor=hover!==null?'grab':'default'}});
function release(e){drag=null;if(cv.hasPointerCapture(e.pointerId))cv.releasePointerCapture(e.pointerId)}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);cv.addEventListener('lostpointercapture',()=>{drag=null});
ui.reset.addEventListener('click',reset);ui.stop.addEventListener('click',stop);ui.start.addEventListener('click',begin);ui.retry.addEventListener('click',retry);ui.hint.addEventListener('click',()=>{hint=!hint;refresh({announce:false});if(hint){const messages=['윗변과 아랫변의 방향을 비교하세요.','한 꼭짓점에서 만나는 두 변의 각도를 비교하세요.','세 변이 같은 길이가 되게 해보세요.','서로 이웃하지 않는 꼭짓점 두 개를 이으세요.','같은 사각형에서 평행과 직각 두 가지를 동시에 찾아보세요.','마름모는 네 변의 길이가 모두 같아요.','네 변의 길이와 네 각을 모두 확인하세요.'];feedback('단서를 켰어요.',messages[mode()]);toast(messages[mode()])}else toast('힌트를 숨겼어요. 이번에는 직접 발견해 보세요.')});
ui.next.addEventListener('click',()=>loadStage(current<stages.length-1?current+1:0));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&phase==='running')stop();if(e.key==='r'&&phase==='running')retry()});
// Local test interface; this runs entirely inside the browser and sends no data.
window.__mathLabTest={state:()=>({stage:current,part,mode:mode(),parts:stages[current].modes.length,phase,ready:isReady(),geom:mode()===3?{edges:[...geom.edges]}:JSON.parse(JSON.stringify(geom)),attempt:attempts[current],completed:[...completed],ball:{...ball},elapsed,selected}),setStage:loadStage,nextModule:advanceModule,drag:(name,x,y)=>{drag=name;editPoint({x,y});drag=null},connect:(i,j)=>{selectVertex(String(i));selectVertex(String(j))},begin,stop,retry,advance:(seconds)=>{const n=Math.ceil(seconds/.012);for(let i=0;i<n&&phase==='running';i++)physicsStep(.012)},check:inspect};
try{const saved=JSON.parse(localStorage.getItem('polygon-stage-cleared')||'[]');if(Array.isArray(saved))completed=Array.from({length:stages.length},(_,i)=>Boolean(saved[i]))}catch{}buildNav();loadStage(0);requestAnimationFrame(tick);
})();
